name: slop
version: '1.0-SNAPSHOT'
main: me.remag501.slop
api-version: '1.21'

commands:
  power:
    description: Open the superpower selector UI.
    usage: /power [gui|list|info|ability|choose|clear]
    aliases: [powers, superpower]

permissions:
  slop.power.use:
    description: Allows players to use /power commands.
    default: true
